<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | Maleja's Pink Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar bg-white shadow-sm border-bottom border-danger"><div class="container"><a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="../index.html"><img src="../assets/logo/malejas-pink-store-logo.png" alt="Logo Maleja's Pink Store" width="56" height="56" class="rounded-circle border border-danger">Maleja's Pink Store</a><a class="btn btn-outline-dark" href="../index.html"><i class="bi bi-house-heart me-1"></i>Inicio</a></div></nav>
    <!-- Recuperación de contraseña: flujo demostrativo basado en correo requerido. -->
    <main class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow rounded-4 border-danger">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4"><img src="../assets/logo/malejas-pink-store-logo.png" alt="Logo Maleja's Pink Store" width="92" height="92" class="rounded-circle border border-danger shadow-sm"><h1 class="h3 fw-bold text-danger mt-3">Recuperar contraseña</h1></div>
                        <div class="alert alert-danger" role="alert"><i class="bi bi-envelope-heart me-2"></i>Ingresa tu correo y enviaremos instrucciones para restablecer tu acceso.</div>
                        <!-- El formulario vuelve al login después de enviar las instrucciones simuladas. -->
                        <form action="login.html" method="get" class="row g-3">
                            <div class="col-12"><div class="form-floating"><input type="email" class="form-control" id="correo" name="correo" placeholder="correo@ejemplo.com" required><label for="correo">Correo electrónico</label></div></div>
                            <div class="col-12 d-grid"><button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-send me-2"></i>Enviar instrucciones</button></div>
                        </form>
                        <div class="d-flex justify-content-between mt-4"><a href="login.html" class="link-danger">Volver al login</a><a href="registro.html" class="link-dark">Crear cuenta</a></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Bootstrap Bundle requerido por los componentes Bootstrap. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
