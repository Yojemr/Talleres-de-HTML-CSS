<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Maleja's Pink Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar bg-white shadow-sm border-bottom border-danger"><div class="container"><a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="../index.html"><img src="../assets/logo/malejas-pink-store-logo.png" alt="Logo Maleja's Pink Store" width="56" height="56" class="rounded-circle border border-danger">Maleja's Pink Store</a><a class="btn btn-outline-dark" href="../index.html"><i class="bi bi-house-heart me-1"></i>Inicio</a></div></nav>
    <!-- Formulario de registro: captura datos básicos y tipo de usuario. -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9">
                <div class="card shadow rounded-4 border-danger">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4"><img src="../assets/logo/malejas-pink-store-logo.png" alt="Logo Maleja's Pink Store" width="92" height="92" class="rounded-circle border border-danger shadow-sm"><h1 class="h3 fw-bold text-danger mt-3">Crear cuenta</h1><p class="text-secondary mb-0">Regístrate como cliente o expositor de belleza.</p></div>
                        <!-- Validaciones HTML5: required, minlength, email y aceptación de términos. -->
                        <form action="cliente.html" method="get" class="row g-3">
                            <div class="col-md-6"><div class="form-floating"><input type="text" class="form-control" id="nombres" name="nombres" placeholder="Nombres" minlength="2" required><label for="nombres">Nombres</label></div></div>
                            <div class="col-md-6"><div class="form-floating"><input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Apellidos" minlength="2" required><label for="apellidos">Apellidos</label></div></div>
                            <div class="col-md-6"><div class="form-floating"><input type="email" class="form-control" id="correo" name="correo" placeholder="correo@ejemplo.com" required><label for="correo">Correo</label></div></div>
                            <div class="col-md-6"><div class="form-floating"><input type="tel" class="form-control" id="telefono" name="telefono" placeholder="3001234567" minlength="7" required><label for="telefono">Teléfono</label></div></div>
                            <div class="col-md-6"><div class="form-floating"><select class="form-select" id="tipoUsuario" name="tipoUsuario" required><option value="" selected>Seleccionar</option><option value="cliente">Cliente</option><option value="expositor">Expositor</option></select><label for="tipoUsuario">Tipo de usuario</label></div></div>
                            <div class="col-md-6"><div class="form-floating"><input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" minlength="6" required><label for="password">Contraseña</label></div></div>
                            <div class="col-md-6"><div class="form-floating"><input type="password" class="form-control" id="confirmar" name="confirmar" placeholder="Confirmar contraseña" minlength="6" required><label for="confirmar">Confirmación de contraseña</label></div></div>
                            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" value="acepto" id="terminos" required><label class="form-check-label" for="terminos">Acepto términos y condiciones de Maleja's Pink Store</label></div></div>
                            <div class="col-12 d-grid d-md-flex gap-2"><button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-person-plus me-2"></i>Crear cuenta</button><a href="login.html" class="btn btn-dark btn-lg"><i class="bi bi-box-arrow-in-right me-2"></i>Ya tengo cuenta</a></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Bootstrap Bundle requerido por los componentes Bootstrap. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
