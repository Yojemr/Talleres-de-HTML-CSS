<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Maleja's Pink Store</title>
    <link rel="icon" type="image/png" href="../assets/logo/malejas-pink-store-logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar simple para volver al inicio desde el flujo de acceso. -->
    <nav class="navbar bg-white shadow-sm border-bottom border-danger">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="../index.html"><img src="../assets/logo/malejas-pink-store-logo.png" alt="Logo Maleja's Pink Store" width="56" height="56" class="rounded-circle border border-danger">Maleja's Pink Store</a>
            <a class="btn btn-outline-dark" href="../index.html"><i class="bi bi-house-heart me-1"></i>Inicio</a>
        </div>
    </nav>
    <!-- Página de acceso: dos formularios demostrativos con validación required. -->
    <main class="container py-5">
        <div class="text-center mb-5">
            <img src="../assets/logo/malejas-pink-store-logo.png" alt="Logo Maleja's Pink Store" width="104" height="104" class="rounded-circle border border-danger shadow-sm">
            <h1 class="h2 fw-bold text-danger mt-3">Acceso a Maleja's Pink Store</h1>
            <p class="text-secondary mb-0">Elige el tipo de ingreso. Por ahora solo se valida que los campos no estén vacíos.</p>
        </div>
        <div class="row g-4 justify-content-center align-items-stretch">
            <div class="col-12 col-lg-5">
                <div class="card shadow rounded-4 border-danger h-100">
                    <div class="card-header bg-danger text-white text-center rounded-top-4">
                        <i class="bi bi-person-heart display-6"></i>
                        <h2 class="h4 fw-bold mt-2 mb-0">Login cliente</h2>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <!-- Formulario cliente: redirige al dashboard de cliente si los campos no están vacíos. -->
                        <form action="cliente.html" method="get" class="row g-3">
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="correoCliente" name="correoCliente" placeholder="correo@ejemplo.com" required>
                                    <label for="correoCliente">Correo electrónico</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="passwordCliente" name="passwordCliente" placeholder="Contraseña" required>
                                    <label for="passwordCliente">Contraseña</label>
                                </div>
                            </div>
                            <div class="col-12 d-flex justify-content-between align-items-center">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="1" id="recordarCliente">
                                    <label class="form-check-label" for="recordarCliente">Recordarme</label>
                                </div>
                                <a href="recuperar.html" class="link-danger">Recuperar</a>
                            </div>
                            <div class="col-12 d-grid">
                                <button type="submit" class="btn btn-danger btn-lg w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Ingresar como cliente</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-5">
                <div class="card shadow rounded-4 border-dark h-100">
                    <div class="card-header bg-dark text-white text-center rounded-top-4">
                        <i class="bi bi-shield-lock display-6"></i>
                        <h2 class="h4 fw-bold mt-2 mb-0">Login administrativo</h2>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <!-- Formulario administrativo: redirige al panel administrativo en modo demostrativo. -->
                        <form action="admin.html" method="get" class="row g-3">
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="correoAdmin" name="correoAdmin" placeholder="admin@ejemplo.com" required>
                                    <label for="correoAdmin">Correo electrónico</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="passwordAdmin" name="passwordAdmin" placeholder="Contraseña" required>
                                    <label for="passwordAdmin">Contraseña</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="alert alert-dark mb-0" role="alert"><i class="bi bi-info-circle me-2"></i>Acceso demostrativo para gestión interna.</div>
                            </div>
                            <div class="col-12 d-grid">
                                <button type="submit" class="btn btn-dark btn-lg w-100"><i class="bi bi-speedometer2 me-2"></i>Ingresar como administrativo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-center mt-4 mb-0">¿No tienes cuenta? <a href="registro.html" class="link-danger fw-semibold">Regístrate</a></p>
    </main>
    <!-- Bootstrap Bundle mantiene disponibles los componentes interactivos. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
